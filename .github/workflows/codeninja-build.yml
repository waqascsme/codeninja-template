# Managed by CodeNinja — changes to this file may be overwritten.
name: codeninja-build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect toolchain
        id: toolchain
        shell: bash
        run: |
          set +e
          JAVA=17
          GRADLE_OUT=8.7
          AGP=""
          GRADLE_VER=""

          AGP=$(grep -rhoE "com\.android\.tools\.build:gradle: *[\"']?[0-9]+\.[0-9]+(\.[0-9]+)?" --include='*.gradle' --include='*.gradle.kts' --include='*.toml' . 2>/dev/null | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | head -1)

          if [ -z "$AGP" ]; then
            AGP=$(grep -rhoiE "^[[:space:]]*(agp|androidGradlePlugin|androidGradle|android)[[:space:]]*=[[:space:]]*\"[0-9]+\.[0-9]+(\.[0-9]+)?\"" --include='*.toml' . 2>/dev/null | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | head -1)
          fi

          if [ -z "$AGP" ]; then
            REF=$(grep -rh "com\.android\.tools\.build:gradle\|com\.android\.application\|com\.android\.library\|com\.android\.dynamic-feature" --include='*.toml' . 2>/dev/null | grep -o "version\.ref *= *\"[^\"]*\"" | head -1 | sed -E 's/.*"([^"]*)".*/\1/')
            if [ -n "$REF" ]; then
              AGP=$(grep -rhoiE "^[[:space:]]*$REF[[:space:]]*=[[:space:]]*\"[0-9]+\.[0-9]+(\.[0-9]+)?\"" --include='*.toml' . 2>/dev/null | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | head -1)
            fi
          fi

          if [ -z "$AGP" ]; then
            AGP=$(grep -rh "com\.android\.application\|com\.android\.library\|com\.android\.dynamic-feature" --include='*.gradle' --include='*.gradle.kts' . 2>/dev/null | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | head -1)
          fi

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            GRADLE_VER=$(grep -oE "gradle-[0-9]+(\.[0-9]+)+" gradle/wrapper/gradle-wrapper.properties | head -1 | cut -d- -f2)
          fi

          if [ -n "$AGP" ]; then
            AGP_MAJOR=$(echo "$AGP" | cut -d. -f1)
            AGP_MINOR=$(echo "$AGP" | cut -d. -f2)
            [ -z "$AGP_MINOR" ] && AGP_MINOR=0
            if [ "$AGP_MAJOR" -lt 8 ] 2>/dev/null; then
              JAVA=11
              GRADLE_OUT=7.6.4
            else
              if [ "$AGP_MAJOR" -ge 9 ] 2>/dev/null; then GRADLE_OUT=8.11.1; fi
              if [ "$AGP_MAJOR" -eq 8 ] 2>/dev/null && [ "$AGP_MINOR" -ge 7 ] 2>/dev/null; then GRADLE_OUT=8.11.1; fi
            fi
          elif [ -n "$GRADLE_VER" ]; then
            G_MAJOR=$(echo "$GRADLE_VER" | cut -d. -f1)
            G_MINOR=$(echo "$GRADLE_VER" | cut -d. -f2)
            [ -z "$G_MINOR" ] && G_MINOR=0
            if [ "$G_MAJOR" -lt 7 ] 2>/dev/null; then
              JAVA=11
              GRADLE_OUT=7.6.4
            fi
            if [ "$G_MAJOR" -eq 7 ] 2>/dev/null && [ "$G_MINOR" -lt 3 ] 2>/dev/null; then
              JAVA=11
              GRADLE_OUT=7.6.4
            fi
          fi

          EXPLICIT=$(grep -rhoE "jvmToolchain[[:space:]]*\([[:space:]]*[0-9]+|JavaLanguageVersion\.of[[:space:]]*\([[:space:]]*[0-9]+|JavaVersion\.VERSION_[0-9]+|jvmTarget[[:space:]]*=[[:space:]]*[\"'][0-9]+|jvmTarget\.set\([[:space:]]*[\"']?[0-9]+|release[[:space:]]*=[[:space:]]*[0-9]+|release\.set\([[:space:]]*[0-9]+" --include='*.gradle' --include='*.gradle.kts' --include='*.toml' . 2>/dev/null | grep -oE "[0-9]+" | sort -rn | head -1)
          if [ -n "$EXPLICIT" ] && [ "$EXPLICIT" -gt "$JAVA" ] 2>/dev/null; then
            JAVA=$EXPLICIT
          fi
          if [ "$JAVA" -ge 21 ] 2>/dev/null && [ "$GRADLE_OUT" = "7.6.4" ]; then
            GRADLE_OUT=8.7
          fi

          echo "java=$JAVA" >> "$GITHUB_OUTPUT"
          echo "gradle=$GRADLE_OUT" >> "$GITHUB_OUTPUT"
          echo "Detected AGP=$AGP Gradle=$GRADLE_VER Jvm=$EXPLICIT -> JDK $JAVA, Gradle $GRADLE_OUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.toolchain.outputs.gradle }}

      - name: Build debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 90
